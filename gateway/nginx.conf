events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # ── Résolution DNS dynamique (Docker intégré) ─────────────────────────────
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # ── Macro CORS — injectée dans chaque location ────────────────────────────
    map $http_origin $cors_origin {
        default "*";
        "http://localhost:3000" "http://localhost:3000";
        "http://localhost:3001" "http://localhost:3001";
    }

    server {
        listen 80;

        # ── Health check gateway ──────────────────────────────────────────────
        location = /health {
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Content-Type' 'application/json' always;
            return 200 '{"gateway":"ok","status":"UP"}';
        }

        # ── User Service (PHP Laravel + MySQL) ────────────────────────────────
        location /api/users {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;

            set $upstream_user http://user-service:8000;
            rewrite ^/api/users/?(.*)$ /$1 break;
            proxy_pass $upstream_user;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        # ── Health check du User Service ──────────────────────────────────────
        location = /api/health {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://user-service:8000/health;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        # ── Profil utilisateur connecté (User Service) ────────────────────────
        location /api/me {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;

            set $upstream_me http://user-service:8000;
            rewrite ^/api/me/?(.*)$ /me/$1 break;
            proxy_pass $upstream_me;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        # ── Hotel Service (Node.js + Express + H2) ────────────────────────────
        location /api/hotels {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*' always;
