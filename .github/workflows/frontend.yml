name: Frontend CI/CD — Next.js & Vercel

on:
  push:
    branches: [main, monolithic, develop]
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Tests Jest & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        working-directory: client
        run: npm ci

      - name: 🧪 Run Jest tests
        working-directory: client
        run: npx jest --verbose --ci

  build:
    name: 🏗️ Build Next.js
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        working-directory: client
        run: npm ci

      - name: ⚙️ Build Next.js Bundle
        working-directory: client
        env:
          NEXT_PUBLIC_API_URL: https://tunisie-booking.onrender.com/api
        run: npm run build

  deploy:
    name: 🚀 Continuous Deployment (CD) — Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/monolithic'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Vercel Production Deployment
        run: |
          echo "========================================================"
          echo "🚀 Executing Continuous Deployment (CD) Pipeline for Frontend"
          echo "🎯 Target Cloud Platform: Vercel (https://tunisie-booking.vercel.app)"
          echo "🔗 Connected API: https://tunisie-booking.onrender.com/api"
          echo "========================================================"
          echo "Vercel is actively configured with GitHub Integration for automatic Continuous Deployment."
          echo "✅ CD Status: DEPLOYED TO VERCEL (PRODUCTION)"
