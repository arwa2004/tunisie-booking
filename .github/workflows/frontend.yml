name: Frontend CI/CD — Next.js (Vercel)

on:
  push:
    branches: [main, monolithic, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Tests Jest
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        working-directory: client
        run: npm ci

      - name: 🧪 Run Jest tests
        working-directory: client
        run: npx jest --verbose --ci

  build:
    name: 🏗️ Build Next.js
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        working-directory: client
        run: npm ci

      - name: ⚙️ Build Next.js Bundle
        working-directory: client
        env:
          NEXT_PUBLIC_API_URL: https://affectionate-transformation-production.up.railway.app/api
        run: npm run build

  deploy:
    name: 🚀 Continuous Deployment (CD) — Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/monolithic'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Vercel Production Deployment
        run: |
          echo "Executing CD Pipeline for Frontend..."
          echo "Vercel is configured with GitHub Integration for automatic Continuous Deployment."
          echo "CD Status: DEPLOYED TO VERCEL (PRODUCTION)"