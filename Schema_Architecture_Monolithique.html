<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schéma d'Architecture Monolithique — TunisieBooking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .diagram-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            max-width: 1000px;
            width: 100%;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .instructions {
            margin-top: 25px;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            padding: 12px 25px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #475569;
        }

        .instructions span {
            color: #0284c7;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📐 Architecture Monolithique — TunisieBooking</h1>
        <p>Schéma Technique Officiel (Next.js 14, Laravel 11, MySQL 8.0)</p>
    </div>

    <div class="diagram-card">
        <svg viewBox="0 0 950 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Marker Arrows -->
                <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
                </marker>
                <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48" />
                </marker>
                <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
                </marker>
            </defs>

            <!-- 1. NAVIGATEUR CLIENT -->
            <g transform="translate(20, 45)">
                <rect width="180" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
                <text x="90" y="32" text-anchor="middle" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.5">UTILISATEUR</text>
                <text x="90" y="58" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Navigateur Web</text>
                <text x="90" y="78" text-anchor="middle" fill="#64748b" font-size="11">Client PC / Mobile</text>
                <rect x="45" y="86" width="90" height="16" rx="4" fill="#e2e8f0"/>
                <text x="90" y="98" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">HTTP / HTTPS</text>
            </g>

            <!-- ARROW 1 -->
            <g>
                <line x1="200" y1="100" x2="265" y2="100" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" />
                <rect x="208" y="78" width="50" height="16" rx="3" fill="#e0f2fe" stroke="#bae6fd"/>
                <text x="233" y="89" text-anchor="middle" fill="#0369a1" font-size="9" font-weight="700">JSON</text>
            </g>

            <!-- 2. FRONTEND NEXT.JS -->
            <g transform="translate(270, 40)">
                <rect width="190" height="120" rx="12" fill="#000000" stroke="#334155" stroke-width="1.5"/>
                <text x="95" y="30" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.5">COUCHE FRONTEND</text>
                <text x="95" y="58" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">Next.js 14</text>
                <text x="95" y="78" text-anchor="middle" fill="#cbd5e1" font-size="11">App Router · React Server</text>
                <rect x="45" y="92" width="100" height="18" rx="4" fill="#0284c7"/>
                <text x="95" y="105" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">Port 3000</text>
            </g>

            <!-- ARROW 2 -->
            <g>
                <line x1="460" y1="100" x2="535" y2="100" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-red)" />
                <rect x="468" y="72" width="60" height="22" rx="4" fill="#ffe4e6" stroke="#fecdd3"/>
                <text x="498" y="83" text-anchor="middle" fill="#be123c" font-size="9" font-weight="700">API REST</text>
                <text x="498" y="92" text-anchor="middle" fill="#9f1239" font-size="8">Bearer Token</text>
            </g>

            <!-- 3. BACKEND LARAVEL -->
            <g transform="translate(540, 40)">
                <rect width="190" height="120" rx="12" fill="#ff2d20" stroke="#dc2626" stroke-width="1.5"/>
                <text x="95" y="30" text-anchor="middle" fill="#fecdd3" font-size="10" font-weight="700" letter-spacing="0.5">COUCHE BACKEND</text>
                <text x="95" y="58" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">Laravel 11</text>
                <text x="95" y="78" text-anchor="middle" fill="#ffffff" font-size="11">Sanctum Auth · Eloquent</text>
                <rect x="45" y="92" width="100" height="18" rx="4" fill="#991b1b"/>
                <text x="95" y="105" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">Port 8000</text>
            </g>

            <!-- ARROW 3 -->
            <g>
                <line x1="730" y1="100" x2="795" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)" />
                <rect x="738" y="78" width="50" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
                <text x="763" y="89" text-anchor="middle" fill="#334155" font-size="9" font-weight="700">SQL</text>
            </g>

            <!-- 4. BASE DE DONNÉES MYSQL -->
            <g transform="translate(800, 40)">
                <rect width="130" height="120" rx="12" fill="#00758f" stroke="#0284c7" stroke-width="1.5"/>
                <text x="65" y="30" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="700" letter-spacing="0.5">BASE</text>
                <text x="65" y="58" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">MySQL 8.0</text>
                <text x="65" y="78" text-anchor="middle" fill="#e0f2fe" font-size="10">tunisie_booking</text>
                <rect x="25" y="92" width="80" height="18" rx="4" fill="#0369a1"/>
                <text x="65" y="105" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">Port 3306</text>
            </g>
        </svg>
    </div>

    <div class="instructions">
        💡 <span>Comment faire la capture :</span> Ouvrez ce fichier ➔ Appuyez sur <b>Win + Maj + S</b> ➔ Collez directement dans Word !
    </div>

</body>
</html>
