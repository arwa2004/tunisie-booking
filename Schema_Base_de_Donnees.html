<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schéma Relationnel de la Base de Données — TunisieBooking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
        }

        .diagram-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 1100px;
            width: 100%;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .instructions {
            margin-top: 25px;
            background: #1e293b;
            border: 1px dashed #475569;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            color: #cbd5e1;
        }

        .instructions span {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗄️ Diagramme Relationnel (ER Diagram) — MySQL `tunisie_booking`</h1>
        <p>Les 11 Tables Métier et Leurs Relations (Clés Étrangères)</p>
    </div>

    <div class="diagram-container">
        <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <linearGradient id="tblHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0284c7" />
                    <stop offset="100%" stop-color="#0369a1" />
                </linearGradient>
                <linearGradient id="tblHeaderUser" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0d9488" />
                    <stop offset="100%" stop-color="#0f766e" />
                </linearGradient>
                <linearGradient id="tblHeaderRes" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e11d48" />
                    <stop offset="100%" stop-color="#be123c" />
                </linearGradient>
            </defs>

            <!-- CONNECTIONS (RELATION LINES) -->
            <path d="M 190 140 L 400 140" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>
            <path d="M 580 140 L 400 140" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>
            <path d="M 680 70 L 680 110" stroke="#38bdf8" stroke-width="2"/>
            <path d="M 680 270 L 680 330" stroke="#38bdf8" stroke-width="2"/>
            <path d="M 580 200 L 400 360" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
            <path d="M 190 200 L 190 350" stroke="#38bdf8" stroke-width="1.5"/>
            <path d="M 580 240 L 260 380" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

            <!-- TABLE 1: USERS -->
            <g transform="translate(30, 40)">
                <rect width="160" height="200" rx="8" fill="#1e293b" stroke="#0d9488" stroke-width="2"/>
                <rect width="160" height="30" rx="8" fill="url(#tblHeaderUser)"/>
                <text x="80" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">users</text>
                <text x="15" y="52" fill="#2dd4bf" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="72" fill="#cbd5e1" font-size="11">nom, prenom</text>
                <text x="15" y="92" fill="#cbd5e1" font-size="11">email (UQ)</text>
                <text x="15" y="112" fill="#cbd5e1" font-size="11">password</text>
                <text x="15" y="132" fill="#cbd5e1" font-size="11">telephone, photo</text>
                <text x="15" y="152" fill="#fbbf24" font-size="11" font-weight="bold">role (client/admin)</text>
                <text x="15" y="172" fill="#64748b" font-size="10">created_at</text>
            </g>

            <!-- TABLE 2: RESERVATIONS -->
            <g transform="translate(240, 40)">
                <rect width="160" height="250" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
                <rect width="160" height="30" rx="8" fill="url(#tblHeaderRes)"/>
                <text x="80" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">reservations</text>
                <text x="15" y="52" fill="#fda4af" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="72" fill="#38bdf8" font-size="11" font-weight="bold">🔗 user_id (FK)</text>
                <text x="15" y="92" fill="#38bdf8" font-size="11" font-weight="bold">🔗 hotel_id (FK)</text>
                <text x="15" y="112" fill="#38bdf8" font-size="11">🔗 chambre_id (FK)</text>
                <text x="15" y="132" fill="#38bdf8" font-size="11">🔗 pension_id (FK)</text>
                <text x="15" y="152" fill="#cbd5e1" font-size="11">date_arrivee, depart</text>
                <text x="15" y="172" fill="#cbd5e1" font-size="11">nb_chambres, adultes</text>
                <text x="15" y="192" fill="#cbd5e1" font-size="11">nb_enfants, ages</text>
                <text x="15" y="212" fill="#4ade80" font-size="11" font-weight="bold">prix_total</text>
                <text x="15" y="232" fill="#fbbf24" font-size="11">statut</text>
            </g>

            <!-- TABLE 3: DESTINATIONS -->
            <g transform="translate(600, 10)">
                <rect width="160" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
                <rect width="160" height="28" rx="8" fill="url(#tblHeader)"/>
                <text x="80" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">destinations</text>
                <text x="15" y="48" fill="#7dd3fc" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="68" fill="#cbd5e1" font-size="11">nom, region</text>
                <text x="15" y="88" fill="#cbd5e1" font-size="11">image</text>
            </g>

            <!-- TABLE 4: HOTELS -->
            <g transform="translate(580, 130)">
                <rect width="170" height="170" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
                <rect width="170" height="30" rx="8" fill="url(#tblHeader)"/>
                <text x="85" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">hotels</text>
                <text x="15" y="52" fill="#7dd3fc" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="72" fill="#38bdf8" font-size="11" font-weight="bold">🔗 destination_id (FK)</text>
                <text x="15" y="92" fill="#cbd5e1" font-size="11">nom, etoiles</text>
                <text x="15" y="112" fill="#4ade80" font-size="11">prix_par_nuit</text>
                <text x="15" y="132" fill="#cbd5e1" font-size="11">description, image</text>
                <text x="15" y="152" fill="#cbd5e1" font-size="11">disponible (bool)</text>
            </g>

            <!-- TABLE 5: CHAMBRES -->
            <g transform="translate(580, 330)">
                <rect width="170" height="150" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
                <rect width="170" height="30" rx="8" fill="url(#tblHeader)"/>
                <text x="85" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">chambres</text>
                <text x="15" y="52" fill="#7dd3fc" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="72" fill="#38bdf8" font-size="11" font-weight="bold">🔗 hotel_id (FK)</text>
                <text x="15" y="92" fill="#cbd5e1" font-size="11">type, nom</text>
                <text x="15" y="112" fill="#cbd5e1" font-size="11">capacite_adultes/enfants</text>
                <text x="15" y="132" fill="#4ade80" font-size="11">prix_base_nuit, remise</text>
            </g>

            <!-- TABLE 6: AVIS -->
            <g transform="translate(240, 330)">
                <rect width="160" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
                <rect width="160" height="28" rx="8" fill="#d97706"/>
                <text x="80" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">avis</text>
                <text x="15" y="48" fill="#fde68a" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="68" fill="#38bdf8" font-size="11">🔗 user_id (FK)</text>
                <text x="15" y="88" fill="#38bdf8" font-size="11">🔗 hotel_id (FK)</text>
                <text x="15" y="108" fill="#fbbf24" font-size="11">note_globale (1-10)</text>
                <text x="15" y="128" fill="#cbd5e1" font-size="11">commentaire</text>
            </g>

            <!-- TABLE 7: FAVORIS -->
            <g transform="translate(30, 330)">
                <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
                <rect width="160" height="28" rx="8" fill="#db2777"/>
                <text x="80" y="19" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">favoris</text>
                <text x="15" y="48" fill="#fbcfe8" font-size="11" font-weight="bold">🔑 id (PK)</text>
                <text x="15" y="68" fill="#38bdf8" font-size="11">🔗 user_id (FK)</text>
                <text x="15" y="88" fill="#38bdf8" font-size="11">🔗 hotel_id (FK)</text>
            </g>

            <!-- TABLE 8 & 9 & 10 -->
            <g transform="translate(800, 130)">
                <rect width="170" height="110" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
                <rect width="170" height="28" rx="8" fill="#475569"/>
                <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">voyages</text>
                <text x="15" y="48" fill="#cbd5e1" font-size="10">id, nom, pays, image</text>
                <text x="15" y="68" fill="#4ade80" font-size="10">prix, duree</text>
                <text x="15" y="88" fill="#cbd5e1" font-size="10">description</text>
            </g>

            <g transform="translate(800, 270)">
                <rect width="170" height="100" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
                <rect width="170" height="28" rx="8" fill="#475569"/>
                <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">pensions</text>
                <text x="15" y="48" fill="#cbd5e1" font-size="10">id, nom (All Inc, Demi...)</text>
                <text x="15" y="68" fill="#4ade80" font-size="10">supplement_prix</text>
            </g>

            <g transform="translate(800, 390)">
                <rect width="170" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
                <rect width="170" height="28" rx="8" fill="#475569"/>
                <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">hotel_photos / services</text>
                <text x="15" y="48" fill="#cbd5e1" font-size="10">id, hotel_id (FK), url</text>
                <text x="15" y="68" fill="#cbd5e1" font-size="10">nom, icone</text>
            </g>

        </svg>
    </div>

    <div class="instructions">
        💡 <span>Comment récupérer cette image pour votre document :</span><br>
        Faites une <b>capture d'écran (Win + Maj + S)</b> et collez directement dans votre document Word/PDF !
    </div>

</body>
</html>
